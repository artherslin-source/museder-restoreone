# Functional-test stack: WordPress 7.0.x (image) → scripts may wp core update to 7.0.3; port 8090.
# Usage from repo root:
#   COMPOSE_PROJECT_NAME=restoreone-ft-small docker compose -f tools/docker/docker-compose.ft-small-8090.yml up -d
services:
  db:
    image: mariadb:10.11
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data_ft8090:/var/lib/mysql

  wordpress:
    image: wordpress:7.0-php8.2-apache
    depends_on:
      - db
    ports:
      - "${MR_FT_HOST_PORT:-8090}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: "0"
    volumes:
      - wp_data_ft8090:/var/www/html
      - ../../:/tmp/museder-restoreone-src:ro
      - ../../logs/test-one:/tmp/test-one:ro
      - ./php.ini:/usr/local/etc/php/conf.d/zzz-museder-restoreone.ini:ro
      - ./mu-plugins/restoreone-e2e-login.php:/var/www/html/wp-content/mu-plugins/restoreone-e2e-login.php:ro

  wpcli:
    image: wordpress:cli-php8.2
    user: "33:33"
    depends_on:
      - wordpress
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp_data_ft8090:/var/www/html
      - ../../:/tmp/museder-restoreone-src:ro
      - ../../logs/test-one:/tmp/test-one:ro
      - ./php.ini:/usr/local/etc/php/conf.d/zzz-museder-restoreone.ini:ro
    working_dir: /var/www/html
    entrypoint: ["wp"]

  # Optional: nginx reverse proxy (profile `ft-nginx-front`) for dual web-server smoke against the same PHP app.
  nginx_front:
    profiles:
      - ft-nginx-front
    image: nginx:1.27-alpine
    depends_on:
      - wordpress
    ports:
      - "${MR_FT_NGINX_PORT:-8091}:80"
    volumes:
      - ./nginx-restoreone-proxy.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  db_data_ft8090:
  wp_data_ft8090:
